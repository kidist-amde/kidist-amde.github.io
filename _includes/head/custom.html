{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" type="image/svg+xml"
      href="{{ '/images/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="48x48"
      href="{{ '/images/favicon-48x48.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="96x96"
      href="{{ '/images/favicon-96x96.png' | relative_url }}">
<link rel="shortcut icon"
      href="{{ '/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180"
      href="{{ '/images/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
